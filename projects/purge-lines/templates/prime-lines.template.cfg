# Toolchanger Purge Lines 1.0.0; MIT; Cong Duong / IDcrazy123
# Generated locally. No homing, mesh/probe, offset saving or printer start/end here.
# Entry: PRIME_LINES INITIAL_TOOL=n Tn_TEMP=...; only listed positive-temperature tools run.
# Exit: initial tool mounted, G90/M83/E0, at travel_z with initial_retract still applied.
# Caller/slicer owns matching recovery. See README.md before installation.
[gcode_macro _TC_PURGE_CONFIG]
variable_profile: {'schema': 1, 'reviewed': False, 'axis': 'y', 'purge_area': {'x_min': 10, 'x_max': 24, 'y_min': 20, 'y_max': 280}, 'line_length': 52, 'line_gap': 6, 'edge_margin': 2, 'passes': 3, 'pass_spacing': 3, 'prime_z': 0.28, 'travel_z': 5, 'wipe_distance': 4, 'purge_cross_section': 0.6, 'print_speed': 10, 'travel_speed': 60, 'z_speed': 5, 'retract_speed': 25, 'tools': [{'id': 0, 'extruder': 'extruder', 'select_command': 'T0', 'nozzle_diameter': 0.4, 'filament_diameter': 1.75, 'max_cross_section': 0.64, 'max_volume_rate': 8, 'entry_recovery': 0, 'parked_retract': 1.8, 'initial_retract': 0.6, 'standby_temp': 150, 'strokes': [[[12, 26.0], [12, 78.0]], [[15, 78.0], [15, 26.0]], [[18, 26.0], [18, 78.0]]], 'wipe': [18, 82.0], 'stroke_length': 52, 'e_per_stroke': 12.97145266799578}, {'id': 2, 'extruder': 'extruder2', 'select_command': 'T2', 'nozzle_diameter': 0.4, 'filament_diameter': 1.75, 'max_cross_section': 0.64, 'max_volume_rate': 8, 'entry_recovery': 0, 'parked_retract': 1.8, 'initial_retract': 0.6, 'standby_temp': 150, 'strokes': [[[12, 157.0], [12, 209.0]], [[15, 209.0], [15, 157.0]], [[18, 157.0], [18, 209.0]]], 'wipe': [18, 213.0], 'stroke_length': 52, 'e_per_stroke': 12.97145266799578}]}
gcode:
    {action_respond_info("Toolchanger Purge Lines config loaded")}

[gcode_macro PRIME_LINES]
description: Purge reviewed tools; leave initial tool mounted and retracted
gcode:
    {% set p = printer["gcode_macro _TC_PURGE_CONFIG"].profile %}
    {% if not p.reviewed %}
        {action_raise_error("Purge: configure and review your actual profile, then build cfg")}
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("Purge: XYZ must be homed by your start macro")}
    {% endif %}
    {% for required in ['_TC_PURGE_RUN', '_TC_PURGE_DRAW', 'SET_HEATER_TEMPERATURE', 'TEMPERATURE_WAIT'] %}
        {% if required not in printer.gcode.commands %}
            {action_raise_error("Purge: missing required helper/command " ~ required)}
        {% endif %}
    {% endfor %}
    {% set ids = p.tools|map(attribute='id')|list %}
    {% set initial = params.INITIAL_TOOL|default(-1)|int %}
    {% if initial not in ids or params.INITIAL_TOOL|default('') != initial|string %}
        {action_raise_error("Purge: INITIAL_TOOL must be a configured integer ID")}
    {% endif %}
    {% set accepted = namespace(keys=['INITIAL_TOOL']) %}
    {% for t in p.tools %}
        {% set accepted.keys = accepted.keys + ['T' ~ t.id|string ~ '_TEMP'] %}
    {% endfor %}
    {% for key in params %}
        {% if key not in accepted.keys %}
            {action_raise_error("Purge: unknown parameter " ~ key)}
        {% endif %}
    {% endfor %}
    {% if not (params['T' ~ initial|string ~ '_TEMP']|default(0)|float(-1) > 0) %}
        {action_raise_error("Purge: initial tool needs its positive Tn_TEMP")}
    {% endif %}
    {% for t in p.tools %}
        {% if t.extruder not in printer.configfile.settings %}
            {action_raise_error("Purge: extruder mapping missing " ~ t.extruder)}
        {% endif %}
        {% set e = printer.configfile.settings[t.extruder] %}
        {% set temp = params['T' ~ t.id|string ~ '_TEMP']|default(0)|float(-1) %}
        {% if not (temp >= 0 and temp < e.max_temp) %}
            {action_raise_error("Purge: invalid/out-of-range temperature for T" ~ t.id|string)}
        {% endif %}
        {% if temp > 0 and temp < e.min_extrude_temp|default(170) %}
            {action_raise_error("Purge: requested temperature below extrusion minimum")}
        {% endif %}
        {% if (e.nozzle_diameter - t.nozzle_diameter)|abs > 0.00001 or (e.filament_diameter - t.filament_diameter)|abs > 0.00001 %}
            {action_raise_error("Purge: nozzle/filament config changed; rebuild profile")}
        {% endif %}
        {% if p.purge_cross_section > e.max_extrude_cross_section|default(4 * e.nozzle_diameter * e.nozzle_diameter) %}
            {action_raise_error("Purge: extrusion cross section exceeds firmware limit")}
        {% endif %}
        {% if not (t.standby_temp >= 0 and t.standby_temp < e.max_temp) %}
            {action_raise_error("Purge: standby temperature exceeds firmware limit")}
        {% endif %}
        {% if [t.entry_recovery, t.parked_retract, t.initial_retract]|max > e.max_extrude_only_distance|default(50) %}
            {action_raise_error("Purge: retract/recovery exceeds firmware distance limit")}
        {% endif %}
        {% if e.max_extrude_only_velocity is defined and p.retract_speed > e.max_extrude_only_velocity %}
            {action_raise_error("Purge: retract speed exceeds firmware limit")}
        {% endif %}
        {% if t.select_command.split()[0] not in printer.gcode.commands %}
            {action_raise_error("Purge: tool selector command missing")}
        {% endif %}
    {% endfor %}
    # Full validation above completes before emitting heat or movement.
    {% for t in p.tools %}
        {% set temp = params['T' ~ t.id|string ~ '_TEMP']|default(0)|float %}
        {% if t.id != initial and temp > 0 %}
            _TC_PURGE_RUN T={t.id} TEMP={temp} FINAL=0
        {% endif %}
    {% endfor %}
    _TC_PURGE_RUN T={initial} TEMP={params['T' ~ initial|string ~ '_TEMP']|float} FINAL=1

[gcode_macro _TC_PURGE_RUN]
gcode:
    {% set p = printer["gcode_macro _TC_PURGE_CONFIG"].profile %}
    {% if not p.reviewed or "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("Purge helper: reviewed profile and XYZ homing required")}
    {% endif %}
    {% set ident = params.T|default(-1)|int %}
    {% if ident not in p.tools|map(attribute='id')|list or params.FINAL|default('') not in ['0','1'] %}
        {action_raise_error("Purge helper: invalid tool or FINAL flag")}
    {% endif %}
    {% set t = p.tools|selectattr('id', 'equalto', params.T|int)|first %}
    {% set e = printer.configfile.settings[t.extruder] %}
    {% set target = params.TEMP|default(-1)|float(-1) %}
    {% if not (e.min_extrude_temp|default(170) <= target < e.max_temp) %}
        {action_raise_error("Purge helper: temperature outside extrusion range")}
    {% endif %}
    {% set gp = printer.gcode_move.gcode_position %}
    {% set dz = printer.gcode_move.position.z - gp.z %}
    {% if not (printer.toolhead.axis_minimum.z <= [gp.z, p.travel_z]|max + dz <= printer.toolhead.axis_maximum.z) %}
        {action_raise_error("Purge helper: pre-selection travel Z outside bounds")}
    {% endif %}
    # PRIME_LINES is the public entry. This helper is private, not a user API.
    SET_HEATER_TEMPERATURE HEATER={t.extruder} TARGET={params.TEMP|float}
    G90
    # Avoid lowering a head already higher than travel_z before toolchange.
    G0 Z{[printer.gcode_move.gcode_position.z, p.travel_z]|max} F{p.z_speed * 60}
    {t.select_command}
    TEMPERATURE_WAIT SENSOR={t.extruder} MINIMUM={params.TEMP|float - 1} MAXIMUM={params.TEMP|float + 3}
    _TC_PURGE_DRAW T={t.id} FINAL={params.FINAL|int}

[gcode_macro _TC_PURGE_DRAW]
gcode:
    {% set p = printer["gcode_macro _TC_PURGE_CONFIG"].profile %}
    {% if not p.reviewed or "xyz" not in printer.toolhead.homed_axes or params.FINAL|default('') not in ['0','1'] %}
        {action_raise_error("Purge draw: reviewed profile, homing and FINAL flag required")}
    {% endif %}
    {% set t = p.tools|selectattr('id', 'equalto', params.T|int)|first %}
    # Evaluated AFTER tool selection and temperature wait.
    {% if printer.toolhead.extruder != t.extruder or not printer[t.extruder].can_extrude %}
        {action_raise_error("Purge: selected extruder mismatch or cold nozzle")}
    {% endif %}
    {% if (printer.gcode_move.extrude_factor - 1.0)|abs > 0.00001 or (printer.gcode_move.speed_factor - 1.0)|abs > 0.00001 %}
        {action_raise_error("Purge: use M220 S100 and M221 S100 before purge")}
    {% endif %}
    {% set th = printer.toolhead %}
    {% set gp = printer.gcode_move.gcode_position %}
    {% set tp = printer.gcode_move.position %}
    {% set dx = tp.x - gp.x %}
    {% set dy = tp.y - gp.y %}
    {% set dz = tp.z - gp.z %}
    {% for stroke in t.strokes %}
        {% for xy in stroke %}
            {% if not (th.axis_minimum.x <= xy[0]+dx <= th.axis_maximum.x and th.axis_minimum.y <= xy[1]+dy <= th.axis_maximum.y) %}
                {action_raise_error("Purge: stroke outside current coordinate bounds")}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% if not (th.axis_minimum.x <= t.wipe[0]+dx <= th.axis_maximum.x and th.axis_minimum.y <= t.wipe[1]+dy <= th.axis_maximum.y and th.axis_minimum.z <= p.prime_z+dz < p.travel_z+dz <= th.axis_maximum.z) %}
        {action_raise_error("Purge: wipe/Z outside current coordinate bounds")}
    {% endif %}
    G90
    M83
    G0 Z{[gp.z, p.travel_z]|max} F{p.z_speed * 60}
    G0 X{t.strokes[0][0][0]} Y{t.strokes[0][0][1]} F{p.travel_speed * 60}
    G0 Z{p.prime_z} F{p.z_speed * 60}
    {% if t.entry_recovery > 0 %}
        G1 E{t.entry_recovery} F{p.retract_speed * 60}
    {% endif %}
    G92 E0
    {% for stroke in t.strokes %}
        G0 X{stroke[0][0]} Y{stroke[0][1]} F{p.travel_speed * 60}
        G1 X{stroke[1][0]} Y{stroke[1][1]} E{t.e_per_stroke} F{p.print_speed * 60}
    {% endfor %}
    G1 E-{t.initial_retract if params.FINAL|int else t.parked_retract} F{p.retract_speed * 60}
    G0 X{t.wipe[0]} Y{t.wipe[1]} F{p.travel_speed * 60}
    G0 Z{p.travel_z} F{p.z_speed * 60}
    {% if not params.FINAL|int %}
        SET_HEATER_TEMPERATURE HEATER={t.extruder} TARGET={t.standby_temp}
    {% endif %}
    G92 E0
    # Deliberate exit contract: no old-tool SAVE/RESTORE offset restoration.
