name: Software validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    env:
      OXPLOW_KLIPPER_SOURCE: ${{ github.workspace }}/.upstream-klipper/klippy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-10-13
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Klipper3d/klipper
          ref: 7bc4d09465d31cd30fc0822e8d0abe02cc8c547f
          path: .upstream-klipper
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_public.py
      - run: python scripts/run_tests.py
      - run: python scripts/verify_bundles.py
